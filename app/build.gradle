plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.rikivpn.browser'
    compileSdk {
        version = release(37)
    }

    // Mandatory dependency for Bongo VPN Library
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }


    defaultConfig {
        applicationId "com.rikivpn.browser"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Required so BuildConfig.VERSION_NAME is generated (used by AboutActivity - Feature 3).
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.viewpager2
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    //Bongo VPN Library
    implementation 'ai.bongotech:bongovpn:1.0.2'

    // Ads (Start.io) - the app is fully free/ad-supported now, no billing/subscription
    implementation 'com.startapp:inapp-sdk:5.3.1'
}
